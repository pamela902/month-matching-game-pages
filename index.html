<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>月份雙語配對遊戲</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.ct{background:rgba(255,255,255,.95);border-radius:20px;padding:30px;max-width:900px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
h1{text-align:center;color:#302b63;font-size:1.8em;margin-bottom:5px}
.sub{text-align:center;color:#666;margin-bottom:20px;font-size:.9em}
#login{text-align:center;padding:40px 20px}
#login label{display:block;margin:10px 0 5px;font-weight:700;color:#555}
#login input{padding:12px 20px;font-size:1.1em;border:2px solid #ddd;border-radius:10px;width:250px;text-align:center;transition:border .3s}
#login input:focus{outline:0;border-color:#302b63}
.btn{padding:14px 40px;font-size:1.1em;border:none;border-radius:30px;cursor:pointer;font-weight:700;transition:all .3s;margin-top:20px}
.btn-go{background:linear-gradient(135deg,#302b63,#5a4eb0);color:#fff;box-shadow:0 4px 15px rgba(48,43,99,.4)}
.btn-go:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(48,43,99,.6)}
.btn-ok{background:linear-gradient(135deg,#11998e,#38ef7d);color:#fff;box-shadow:0 4px 15px rgba(17,153,142,.4)}
.btn-ok:hover{transform:translateY(-2px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
#game{display:none}
.head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:15px;padding:12px 15px;background:#f8f9fa;border-radius:12px}
.head .info{font-size:.95em;color:#444}
.head .info b{color:#302b63}
.timer{font-size:1.5em;font-weight:700;color:#e74c3c}
.stage-tag{display:inline-block;padding:4px 14px;border-radius:20px;font-size:.85em;font-weight:700;color:#fff;margin-right:6px}
.s1{background:#3498db}
.s2{background:#e74c3c}
.pbar{width:100%;height:8px;background:#e0e0e0;border-radius:4px;margin-bottom:5px}
.pfill{height:100%;background:linear-gradient(90deg,#11998e,#38ef7d);border-radius:4px;transition:width .5s;width:0%}
.ptext{text-align:center;color:#666;font-size:.85em;margin-bottom:15px}
.cols{display:flex;gap:15px;justify-content:center}
.col{flex:1;min-width:0}
.col h3{text-align:center;padding:10px;border-radius:10px;margin-bottom:10px;font-size:1em;color:#fff}
.col:nth-child(1) h3{background:#e74c3c}
.col:nth-child(2) h3{background:#3498db}
.card{display:block;width:100%;padding:14px 8px;margin-bottom:8px;background:#fff;border:2px solid #e0e0e0;border-radius:10px;font-size:1.05em;text-align:center;cursor:pointer;transition:all .2s;font-family:inherit}
.card:hover:not(.matched):not(.sel){border-color:#aaa;background:#fafafa}
.card.sel{border-color:#f39c12;background:#fff9e6;box-shadow:0 0 10px rgba(243,156,18,.5);font-weight:700}
.card.matched{visibility:hidden;pointer-events:none}
.card.wrong{border-color:#e74c3c;background:#fadbd8;animation:shake .5s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.area{text-align:center;margin-top:20px}
#result{display:none;text-align:center;padding:40px 20px}
#result .icon{font-size:5em;margin-bottom:20px}
#result .msg{font-size:2em;font-weight:700;margin-bottom:10px}
.good{color:#27ae60}
.bad{color:#e74c3c}
.stats{background:#f8f9fa;border-radius:15px;padding:20px;margin:20px 0;text-align:left;display:inline-block}
.stats p{margin:8px 0;font-size:1.1em;color:#555}
.stats p b{color:#302b63}
.save-ok{color:#27ae60;font-size:.9em;margin-top:10px;display:none}
.stage-popup{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:999;justify-content:center;align-items:center}
.stage-popup.show{display:flex}
.stage-msg{background:#fff;border-radius:20px;padding:40px 50px;text-align:center;animation:pop .4s}
@keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
.stage-msg h2{font-size:2em;color:#302b63;margin-bottom:10px}
.stage-msg p{color:#666;font-size:1.1em;margin-bottom:20px}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);padding:14px 28px;border-radius:12px;color:#fff;font-size:1em;font-weight:700;z-index:1000;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;max-width:90vw}
.toast.show{opacity:1}
.toast.wrong{background:rgba(231,76,60,.9)}
.toast.correct{background:rgba(39,174,96,.9)}
.img-popup{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1001;text-align:center}
.img-popup.show{display:block;animation:popIn .4s}
.img-popup img{max-width:300px;max-height:250px;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
@keyframes popIn{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
.phrase-box{margin-top:15px;padding:12px 18px;background:#fff3cd;border:2px solid #f39c12;border-radius:10px;text-align:center;font-size:1em;color:#6d5200;animation:fadeIn .3s}
.ai-box{margin-top:8px;padding:10px 18px;background:#e8f4fd;border:2px solid #3498db;border-radius:10px;text-align:center;font-size:.9em;color:#1a5276;animation:fadeIn .3s}
.ai-label{font-weight:700;margin-right:4px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media(max-width:768px){.cols{flex-direction:column}.card{padding:10px 6px;font-size:.9em}}
</style>
</head>
<body>
<div class="ct">

<div id="login">
  <h1>月份雙語配對遊戲 <span style="font-size:.4em;color:#aaa;vertical-align:super">v5</span></h1>
  <p class="sub">第一階段：中文↔英文 &nbsp;|&nbsp; 第二階段：中文↔日文</p>
  <label for="c1">班級：</label>
  <input id="c1" placeholder="例：三年一班" maxlength="20">
  <label for="c2">座號：</label>
  <input id="c2" placeholder="例：5" maxlength="5">
  <br>
  <div style="margin-top:15px;font-size:.8em;color:#999">
    <a href="#" onclick="document.getElementById('ai-set').style.display='block';this.style.display='none';return false;">AI 設定（選填）</a>
    <div id="ai-set" style="display:none;margin-top:5px">
      <input id="ak" placeholder="貼上 Groq API Key" style="width:280px;font-size:.85em;padding:8px">
      <br><span style="font-size:.75em;color:#aaa">輸入後 AI 會在答錯時給記憶技巧</span>
    </div>
  </div>
  <br>
  <button class="btn btn-go" id="go">開始遊戲</button>
</div>

<div id="game">
  <h1>月份雙語配對遊戲 <span style="font-size:.4em;color:#aaa;vertical-align:super">v5</span></h1>
  <div class="head">
    <div class="info">
      <span class="stage-tag s1" id="tg">第一階段</span>
      玩家：<b id="pn">---</b> | 得分：<b id="sc">0</b> 分
    </div>
    <div class="timer" id="tm">00:00</div>
  </div>
  <div class="pbar"><div class="pfill" id="pf"></div></div>
  <p class="ptext">已完成 <b id="dn">0</b> / 5 組配對</p>
  <div class="cols" id="cols-area">
    <div class="col"><h3 id="h1">中文</h3><div id="c-a"></div></div>
    <div class="col"><h3 id="h2">英文</h3><div id="c-b"></div></div>
  </div>
  <div class="phrase-box" id="phrase" style="display:none">
    <span id="ph-txt"></span>
  </div>
  <div class="ai-box" id="ai-tip" style="display:none">
    <span class="ai-label">AI 小提示：</span><span id="ai-txt"></span>
  </div>
</div>

<div id="result">
  <div class="icon" id="ri"></div>
  <div class="msg" id="rm"></div>
  <div class="stats">
    <p>玩家：<b id="rp"></b></p>
    <p>總得分：<b id="rs"></b> 分（滿分 100）</p>
    <p>花費時間：<b id="rt"></b></p>
    <p>階段一：<b id="rc1"></b> / 5 &nbsp;|&nbsp; 階段二：<b id="rc2"></b> / 5</p>
  </div>
  <p class="save-ok" id="sv">已儲存成績紀錄</p>
  <button class="btn btn-go" id="re">再玩一次</button>
  <br>
  <button class="btn btn-go" id="quiz-btn" style="background:linear-gradient(135deg,#e67e22,#f39c12);margin-top:10px">AI 隨堂小考</button>
</div>
<div class="toast" id="toast"></div>

<!-- 答對圖片彈窗 -->
<div class="img-popup" id="img-pop"><img id="img-pop-img" src="" alt=""></div>

<!-- 階段轉場彈窗 -->
<div class="stage-popup" id="pop"><div class="stage-msg">
  <h2 id="pop-title"></h2>
  <p id="pop-desc"></p>
  <button class="btn btn-go" id="pop-btn"></button>
</div></div>

<!-- AI 小考彈窗 -->
<div class="stage-popup" id="quiz-pop"><div class="stage-msg" style="max-width:500px">
  <h2 id="quiz-title">AI 隨堂小考</h2>
  <div id="quiz-body"></div>
  <button class="btn btn-go" id="quiz-submit" style="display:none">交卷</button>
  <button class="btn btn-go" id="quiz-close" style="display:none;background:#999">關閉</button>
</div></div>

</div>

<script>
(function(){
var U='https://xrmkwnnlvvrztjgjchwm.supabase.co';
var K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhybWt3bm5sdnZyenRqZ2pjaHdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMTM5NjYsImV4cCI6MjEwMDc4OTk2Nn0.XAmCRwKaFvJ3AI2Tn21wQwOlxoxBPw0HzgizJzIhKB0';

var M=[{z:'一月',e:'January',j:'いちがつ',s:'❄️',c:'#85c1e9'},{z:'二月',e:'February',j:'にがつ',s:'❄️',c:'#85c1e9'},{z:'三月',e:'March',j:'さんがつ',s:'🌸',c:'#f5b7b1'},{z:'四月',e:'April',j:'しがつ',s:'🌸',c:'#f5b7b1'},{z:'五月',e:'May',j:'ごがつ',s:'🌸',c:'#f5b7b1'},{z:'六月',e:'June',j:'ろくがつ',s:'☀️',c:'#f9e79f'},{z:'七月',e:'July',j:'しちがつ',s:'☀️',c:'#f9e79f'},{z:'八月',e:'August',j:'はちがつ',s:'☀️',c:'#f9e79f'},{z:'九月',e:'September',j:'くがつ',s:'🍂',c:'#edbb99'},{z:'十月',e:'October',j:'じゅうがつ',s:'🍂',c:'#edbb99'},{z:'十一月',e:'November',j:'じゅういちがつ',s:'🍂',c:'#edbb99'},{z:'十二月',e:'December',j:'じゅうにがつ',s:'❄️',c:'#85c1e9'}];

// 每月對應季節圖片
var IMG={'一月':'img/winter.jpeg','二月':'img/winter.jpeg','三月':'img/spring_trees.jpg','四月':'img/spring_trees.jpg','五月':'img/spring_trees.jpg','六月':'img/summer.jpg','七月':'img/summer.jpg','八月':'img/summer.jpg','九月':'img/autumn-.jpg','十月':'img/autumn-.jpg','十一月':'img/autumn-.jpg','十二月':'img/winter.jpeg'};
var imgTimer=null;
function showImg(month){
  var src=IMG[month];if(!src)return;
  G('img-pop-img').src=src;G('img-pop').classList.add('show');
  clearTimeout(imgTimer);
  imgTimer=setTimeout(function(){G('img-pop').classList.remove('show');},800);
}
var P={'一月':{e:'New Year',j:'おしょうがつ（正月）'},'二月':{e:'Valentine',j:'せつぶん（節分）'},'三月':{e:'Spring',j:'ひなまつり（雛祭り）'},'四月':{e:'Cherry Blossom',j:'おはなみ（お花見）'},'五月':{e:'Children Day',j:'こどものひ（子供の日）'},'六月':{e:'Rainy Season',j:'つゆ（梅雨）'},'七月':{e:'Summer',j:'たなばた（七夕）'},'八月':{e:'Fireworks',j:'はなび（花火）'},'九月':{e:'Moon Viewing',j:'おつきみ（お月見）'},'十月':{e:'Halloween',j:'ハロウィン'},'十一月':{e:'Autumn Leaves',j:'こうよう（紅葉）'},'十二月':{e:'Christmas',j:'クリスマス'}};

// 語音朗讀（瀏覽器內建）
function SPK(txt,lg){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(txt);
  u.lang=lg;u.rate=0.85;
  window.speechSynthesis.speak(u);
}

var S={id:'',sc:0,mt:0,stg:1,stg1ok:0,stg2ok:0,selA:null,selB:null,ti:null,st:null,el:0,wrong:[]};
// wrong 追蹤答錯的月份（用於 AI 分析）
// stg=1: 中+英, stg=2: 中+日, stg1ok/stg2ok: 各階段答對數, selA/selB: 兩欄選取值

function G(id){return document.getElementById(id);}

function FM(k){for(var i=0;i<M.length;i++){if(M[i].z===k||M[i].e===k||M[i].j===k)return M[i];}return null;}

function SH(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}

function FT(t){var m=Math.floor(t/60),s=t%60;return(m<10?'0':'')+m+':'+(s<10?'0':'')+s;}

var toastTimer=null;
function showToast(msg,type){
  var t=G('toast');t.textContent=msg;t.className='toast '+type+' show';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.remove('show');},3000);
}

// AI 提示（使用 Groq）
var aiTimer=null;
function getGroqKey(){
  var k=G('ak').value.trim();
  if(k){try{localStorage.setItem('groq_key',k);}catch(e){}}else{k=localStorage.getItem('groq_key')||'';}
  return k;
}
// 頁面載入時回填已存的 key
(function(){var saved=localStorage.getItem('groq_key');if(saved)G('ak').value=saved;})();

function aiTip(month,stage){
  var gk=getGroqKey();if(!gk)return;
  var lang=stage===1?'英文':'日文';
  var box=G('ai-tip');box.style.display='block';G('ai-txt').textContent=' AI 老師思考中...';
  clearTimeout(aiTimer);
  fetch('https://api.groq.com/openai/v1/chat/completions',{
    method:'POST',
    headers:{'Authorization':'Bearer '+gk,'Content-Type':'application/json'},
    body:JSON.stringify({
      model:'llama-3.3-70b-versatile',
      messages:[
        {role:'system',content:'你是台灣小學生的語言學習助手。用繁體中文回答，30字以內，語氣活潑有趣。'},
        {role:'user',content:'學生答錯「'+month+'」的'+lang+'配對。給一個超簡單記憶技巧或有趣小知識（30字內）。'}
      ],
      max_tokens:80,temperature:0.7
    })
  }).then(function(r){return r.json();})
  .then(function(d){
    var tip=d.choices&&d.choices[0]&&d.choices[0].message?d.choices[0].message.content:'多練習幾次就會記住囉！';
    G('ai-txt').textContent=tip;
    aiTimer=setTimeout(function(){box.style.display='none';},8000);
  })
  .catch(function(){
    G('ai-txt').textContent='多練習幾次就會記住囉！';
    aiTimer=setTimeout(function(){box.style.display='none';},5000);
  });
}

// AI 隨堂小考
var quizData=[],quizIdx=0,quizScore=0,quizTotal=0;
function startQuiz(){
  var gk=getGroqKey();if(!gk){alert('請先在登入頁設定 Groq API Key');return;}
  G('quiz-pop').classList.add('show');
  G('quiz-title').textContent='AI 出題中...';
  G('quiz-body').innerHTML='<p style="color:#666">正在生成題目，請稍候...</p>';
  G('quiz-submit').style.display='none';
  G('quiz-close').style.display='none';

  var wrongs=S.wrong.length>0?S.wrong.join('、'):'無特別弱項';
  fetch('https://api.groq.com/openai/v1/chat/completions',{
    method:'POST',
    headers:{'Authorization':'Bearer '+gk,'Content-Type':'application/json'},
    body:JSON.stringify({
      model:'llama-3.3-70b-versatile',
      messages:[
        {role:'system',content:'你是台灣國小語言老師。出5題月份選擇題，只考英文單字或日文平假名，不考中文。每題只問一種語言。問英文→4個選項全是英文單字。問日文→4個選項全是平假名。禁止出現中文拼音、注音、漢字。輸出嚴格JSON。'},
        {role:'user',content:'參考資料：一月=いちがつ、二月=にがつ、三月=さんがつ、四月=しがつ、五月=ごがつ、六月=ろくがつ、七月=しちがつ、八月=はちがつ、九月=くがつ、十月=じゅうがつ、十一月=じゅういちがつ、十二月=じゅうにがつ。英文：一月=January、二月=February、三月=March、四月=April、五月=May、六月=June、七月=July、八月=August、九月=September、十月=October、十一月=November、十二月=December。學生答錯過的月份：'+wrongs+'。針對弱項出5題。輸出：[{"q":"...","opts":["...",...],"ans":0}]'}
      ],
      max_tokens:600,temperature:0.7
    })
  }).then(function(r){return r.json();})
  .then(function(d){
    var raw=d.choices&&d.choices[0]&&d.choices[0].message?d.choices[0].message.content:'[]';
    try{
      var json=raw.replace(/```json|```/g,'').trim();
      quizData=JSON.parse(json);
    }catch(e){quizData=[];}
    if(!quizData.length){
      G('quiz-body').innerHTML='<p>出題失敗，請再試一次</p>';
      G('quiz-close').style.display='inline-block';
      return;
    }
    quizData=SH(quizData);
    quizData=quizData.slice(0,5);
    quizIdx=0;quizScore=0;quizTotal=quizData.length;
    renderQuizQ();
  })
  .catch(function(){
    G('quiz-body').innerHTML='<p>連線失敗，請檢查網路</p>';
    G('quiz-close').style.display='inline-block';
  });
}

function renderQuizQ(){
  if(quizIdx>=quizTotal){
    var emoji=quizScore===quizTotal?'🎉🏆':quizScore>=quizTotal/2?'👍':'💪';
    G('quiz-title').textContent='測驗結果';
    G('quiz-body').innerHTML='<h2 style="font-size:2.5em">'+emoji+'</h2><p style="font-size:1.4em">答對 <b>'+quizScore+'</b> / '+quizTotal+' 題</p>'+(quizScore===quizTotal?'<p style="color:#27ae60">太厲害了！全部答對！</p>':'<p style="color:#e67e22">再練習一下會更好！</p>');
    G('quiz-submit').style.display='none';
    G('quiz-close').textContent='關閉';
    G('quiz-close').style.display='inline-block';
    G('quiz-close').onclick=function(){G('quiz-pop').classList.remove('show');};
    return;
  }
  var q=quizData[quizIdx];
  G('quiz-title').textContent='第 '+(quizIdx+1)+' / '+quizTotal+' 題';
  var h='<div style="text-align:left;margin-bottom:12px"><b>'+q.q+'</b></div>';
  for(var j=0;j<q.opts.length;j++){
    h+='<label class="quiz-opt" style="display:block;text-align:left;padding:8px 12px;margin:4px 0;border-radius:8px;cursor:pointer;transition:background .2s"><input type="radio" name="qa" value="'+j+'"> '+q.opts[j]+'</label>';
  }
  G('quiz-body').innerHTML=h;
  G('quiz-submit').style.display='inline-block';
  G('quiz-submit').textContent='下一題';
  G('quiz-submit').onclick=checkQuizQ;
  G('quiz-close').style.display='none';
}

function checkQuizQ(){
  var sel=document.querySelector('input[name="qa"]:checked');
  if(!sel){alert('請選擇一個答案');return;}
  var ans=parseInt(sel.value),correct=quizData[quizIdx].ans;
  if(ans===correct){quizScore++;}
  var labels=document.querySelectorAll('.quiz-opt');
  for(var i=0;i<labels.length;i++){
    labels[i].style.pointerEvents='none';
    if(i===correct)labels[i].style.background='#d4efdf';
    if(i===ans&&i!==correct)labels[i].style.background='#fadbd8';
  }
  G('quiz-submit').textContent='繼續';
  G('quiz-submit').onclick=function(){quizIdx++;renderQuizQ();};
}

function GO(){
  var a=G('c1').value.trim(),b=G('c2').value.trim();
  if(!a||!b){alert('請填寫班級和座號');return;}
  S.id=a+b+'號';S.sc=0;S.mt=0;S.stg=1;S.stg1ok=0;S.stg2ok=0;S.selA=S.selB=null;S.el=0;S.st=Date.now();S.wrong=[];
  G('login').style.display='none';G('game').style.display='block';G('result').style.display='none';
  G('pn').textContent=S.id;G('sc').textContent='0';G('dn').textContent='0';G('pf').style.width='0%';G('tm').textContent='00:00';
  G('tg').textContent='第一階段';G('tg').className='stage-tag s1';
  G('h1').textContent='中文';G('h2').textContent='英文';
  RC();
  clearInterval(S.ti);
  S.ti=setInterval(function(){S.el=Math.floor((Date.now()-S.st)/1000);G('tm').textContent=FT(S.el);},200);
}

function RC(){
  G('phrase').style.display='none';G('ai-tip').style.display='none';
  // stg=1: 中文 vs 英文, stg=2: 中文 vs 日文, 每階段隨機 5 個月
  var pool=SH(M).slice(0,5);
  var a=SH(pool),b=SH(pool);
  var mk=function(lst,id,lg){
    G(id).innerHTML='';
    for(var i=0;i<lst.length;i++){
      var m=lst[i];
      var t=(lg==='zh')?m.z:(lg==='en')?m.e:m.j;
      var el=document.createElement('button');
      el.className='card';el.setAttribute('data-lg',lg);el.setAttribute('data-k',m.z);
      el.textContent=t;
      el.onclick=function(){CK(this,this.getAttribute('data-lg'),this.getAttribute('data-k'));};
      G(id).appendChild(el);
    }
  };
  mk(a,'c-a','zh');
  if(S.stg===1){mk(b,'c-b','en');}
  else{mk(b,'c-b','ja');}
}

function CK(el,lg,k){
  if(el.classList.contains('matched'))return;
  var pv=document.querySelector('.card.sel[data-lg="'+lg+'"]');
  if(pv&&pv!==el)pv.classList.remove('sel');
  el.classList.toggle('sel');
  // 語音朗讀
  var txt=el.textContent;
  if(lg==='en')SPK(txt,'en-US');
  else if(lg==='ja')SPK(txt,'ja-JP');
  // 顯示關聯詞語
  if(el.classList.contains('sel')){
    var ph=P[k];
    if(ph){
      G('phrase').style.display='block';
      G('ph-txt').textContent=k+'：'+ph.e+' / '+ph.j;
    }
  }else{G('phrase').style.display='none';}
  if(lg==='zh')S.selA=el.classList.contains('sel')?k:null;
  else S.selB=el.classList.contains('sel')?k:null;
  // 兩欄都選了就自動判斷
  if(S.selA&&S.selB){setTimeout(function(){CF();},150);}
}

function CF(){
  if(!S.selA||!S.selB)return;
  var els=document.querySelectorAll('.card.sel'),good=(S.selA===S.selB);
  if(good){
    for(var i=0;i<els.length;i++)els[i].classList.add('matched');
    S.sc+=10;S.mt++;
    if(S.stg===1)S.stg1ok++;else S.stg2ok++;
    G('sc').textContent=S.sc;G('dn').textContent=S.mt;G('pf').style.width=(S.mt/10*100)+'%';
    showImg(S.selA);
  }else{
    for(var i=0;i<els.length;i++){els[i].classList.add('wrong');(function(e){setTimeout(function(){e.classList.remove('wrong');},500);})(els[i]);}
    S.sc=Math.max(0,S.sc-2);G('sc').textContent=S.sc;
    // 顯示正確答案
    var lang=S.stg===1?'en':'ja';
    var m1=FM(S.selA),m2=FM(S.selB);
    var ans='答錯了！'+S.selA+' 的正確配對是 '+(lang==='en'?m1.e:m1.j)+'，'+S.selB+' 的正確配對是 '+(lang==='en'?m2.e:m2.j);
    showToast(ans,'wrong');
    aiTip(m1.z, S.stg);
    if(S.wrong.indexOf(S.selA)<0)S.wrong.push(S.selA);
    if(S.wrong.indexOf(S.selB)<0)S.wrong.push(S.selB);
  }
  for(var i=0;i<els.length;i++)els[i].classList.remove('sel');
  S.selA=S.selB=null;G('phrase').style.display='none';G('ai-tip').style.display='none';

  // 階段完成判斷
  if(S.stg===1 && S.stg1ok>=5){
    showPopup();
  }else if(S.stg===2 && S.stg2ok>=5){
    EG();
  }
}

function showPopup(){
  clearInterval(S.ti);
  G('pop-title').textContent='第一階段完成！';
  G('pop-desc').textContent='中文↔英文全對，準備進入第二階段：中文↔日文';
  G('pop-btn').textContent='開始第二階段';
  G('pop-btn').onclick=startStage2;
  G('pop').classList.add('show');
}

function startStage2(){
  G('pop').classList.remove('show');
  S.stg=2;S.selA=S.selB=null;S.mt=S.stg1ok;
  G('tg').textContent='第二階段';G('tg').className='stage-tag s2';
  G('h1').textContent='中文';G('h2').textContent='日文';
  G('dn').textContent=S.mt;G('pf').style.width=(S.mt/10*100)+'%';
  RC();
  S.st=Date.now();
  S.ti=setInterval(function(){S.el=Math.floor((Date.now()-S.st)/1000);G('tm').textContent=FT(S.el);},200);
}

function EG(){
  clearInterval(S.ti);var p=S.sc>=80;
  G('game').style.display='none';G('result').style.display='block';
  G('rp').textContent=S.id;G('rs').textContent=S.sc;G('rt').textContent=FT(S.el);
  G('rc1').textContent=S.stg1ok;G('rc2').textContent=S.stg2ok;
  if(p){G('ri').textContent='🎉🌟🏆';G('rm').textContent='你好棒！';G('rm').className='msg good';}
  else{G('ri').textContent='💪📚🔥';G('rm').textContent='再加油！';G('rm').className='msg bad';}
  SV(S.id,S.sc,S.stg1ok+S.stg2ok,S.el,p);
}

function SV(sid,sc,tm,ts,ps){
  fetch(U+'/rest/v1/game_scores',{method:'POST',headers:{'Content-Type':'application/json','apikey':K,'Authorization':'Bearer '+K,'Prefer':'return=minimal'},body:JSON.stringify({student_id:sid,score:sc,total_matches:tm,time_seconds:ts,passed:ps})})
  .then(function(r){if(r.ok){G('sv').style.display='block';}else{G('sv').textContent='成績儲存失敗';G('sv').style.display='block';G('sv').style.color='#e74c3c';}})
  .catch(function(){G('sv').textContent='成績儲存失敗';G('sv').style.display='block';G('sv').style.color='#e74c3c';});
}

function RE(){G('result').style.display='none';G('login').style.display='block';G('c1').value='';G('c2').value='';}

G('go').onclick=GO;
G('re').onclick=RE;
G('quiz-btn').onclick=startQuiz;
G('c2').onkeydown=function(e){if(e.key==='Enter')GO();};
})();
</script>
</body>
</html>
